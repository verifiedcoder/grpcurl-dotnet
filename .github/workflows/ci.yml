name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # protoc lets the proto-source tests (CLI --proto + Studio Proto descriptor mode) actually run
      # on every OS instead of skipping; without it the proto compilation path gets no CI coverage.
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SDK
        run: dotnet --info

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode GrpCurl.Net.slnx

      - name: Build (Release)
        run: dotnet build GrpCurl.Net.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --solution GrpCurl.Net.slnx
          --configuration Release
          --no-build
          --no-restore
          --
          --report-xunit-trx
          --results-directory=${{ github.workspace }}/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ${{ github.workspace }}/TestResults/**/*.trx
          if-no-files-found: warn

      - name: Publish CLI smoke (GrpCurl.Net)
        run: dotnet publish Src/GrpCurl.Net/GrpCurl.Net.csproj --configuration Release --no-restore --output ${{ github.workspace }}/publish/GrpCurl.Net

      - name: Publish CLI smoke (Gql2Grpc)
        run: dotnet publish Src/Gql2Grpc/Gql2Grpc.csproj --configuration Release --no-restore --output ${{ github.workspace }}/publish/Gql2Grpc

      - name: Pack NuGet tool (GrpCurl.Net)
        run: dotnet pack Src/GrpCurl.Net/GrpCurl.Net.csproj --configuration Release --no-build --no-restore --output ${{ github.workspace }}/packages

      - name: Pack NuGet tool (Gql2Grpc)
        run: dotnet pack Src/Gql2Grpc/Gql2Grpc.csproj --configuration Release --no-build --no-restore --output ${{ github.workspace }}/packages

      - name: Invoke published CLIs --version (POSIX)
        if: runner.os != 'Windows'
        run: |
          dotnet ${{ github.workspace }}/publish/GrpCurl.Net/GrpCurl.Net.dll --version
          dotnet ${{ github.workspace }}/publish/Gql2Grpc/Gql2Grpc.dll --version

      - name: Invoke published CLIs --version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet "${{ github.workspace }}\publish\GrpCurl.Net\GrpCurl.Net.dll" --version
          dotnet "${{ github.workspace }}\publish\Gql2Grpc\Gql2Grpc.dll" --version

  coverage:
    name: coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Run (not skip) the proto-source tests under coverage too.
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode GrpCurl.Net.slnx

      - name: Build (Release)
        run: dotnet build GrpCurl.Net.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test --solution GrpCurl.Net.slnx
          --configuration Release
          --no-build
          --no-restore
          --
          --coverlet
          --coverlet-output-format cobertura
          --results-directory=${{ github.workspace }}/coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ github.workspace }}/coverage
          if-no-files-found: warn

      # Studio view-model coverage gate (SPEC-070 §6): the ViewModels layer carries the
      # app logic and must stay ≥ 80% line coverage. Scoped to that assembly only — the
      # views project (XAML-generated) is not gated. The script unions the per-project
      # Cobertura reports a solution-wide run produces.
      - name: Coverage gate (GrpCurl.Net.Studio.ViewModels ≥ 80%)
        run: >
          python3 Scripts/check-coverage-gate.py
          --coverage-dir ${{ github.workspace }}/coverage
          --package GrpCurl.Net.Studio.ViewModels
          --min 0.80

  docfx:
    name: docs (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode GrpCurl.Net.slnx

      - name: Build docs
        run: docfx Docs/docfx.json --warningsAsErrors

      - name: Upload docs site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docfx-site
          path: Docs/_site
          if-no-files-found: warn

  validation:
    name: validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode GrpCurl.Net.slnx

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y

      - name: Run ValidationRunner
        run: dotnet run --project Scripts/ValidationRunner/ValidationRunner.csproj --configuration Release -- --ci

  conformance:
    name: conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CONFORMANCE_VERSION: v1.0.5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode GrpCurl.Net.slnx

      - name: Build conformance adapter (Release)
        run: dotnet build Tests/GrpCurl.Net.Conformance/GrpCurl.Net.Conformance.csproj --configuration Release --no-restore

      - name: Download connectconformance (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   asset="connectconformance-${CONFORMANCE_VERSION}-Linux-x86_64.tar.gz" ;;
            Linux-ARM64) asset="connectconformance-${CONFORMANCE_VERSION}-Linux-aarch64.tar.gz" ;;
            macOS-ARM64) asset="connectconformance-${CONFORMANCE_VERSION}-Darwin-arm64.tar.gz" ;;
            macOS-X64)   asset="connectconformance-${CONFORMANCE_VERSION}-Darwin-x86_64.tar.gz" ;;
            *) echo "unsupported runner: ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/conformance"
          curl -fsSL "https://github.com/connectrpc/conformance/releases/download/${CONFORMANCE_VERSION}/${asset}" \
            | tar -xz -C "$RUNNER_TEMP/conformance"
          echo "$RUNNER_TEMP/conformance" >> "$GITHUB_PATH"

      - name: Download connectconformance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "connectconformance-$env:CONFORMANCE_VERSION-Windows-x86_64.zip"
          Invoke-WebRequest "https://github.com/connectrpc/conformance/releases/download/$env:CONFORMANCE_VERSION/$asset" -OutFile "$env:RUNNER_TEMP\$asset"
          Expand-Archive "$env:RUNNER_TEMP\$asset" -DestinationPath "$env:RUNNER_TEMP\conformance"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\conformance"

      - name: Run conformance suite
        shell: bash
        run: |
          connectconformance --mode client \
            --conf Tests/GrpCurl.Net.Conformance/conformance-config.yaml \
            --known-failing @Tests/GrpCurl.Net.Conformance/known-failing.txt \
            -- dotnet exec Tests/GrpCurl.Net.Conformance/bin/Release/net10.0/GrpCurl.Net.Conformance.dll

  conformance-studio:
    name: conformance-studio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CONFORMANCE_VERSION: v1.0.5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode GrpCurl.Net.slnx

      - name: Build Studio conformance adapter (Release)
        run: dotnet build Tests/GrpCurl.Net.Studio.Conformance/GrpCurl.Net.Studio.Conformance.csproj --configuration Release --no-restore

      - name: Download connectconformance (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   asset="connectconformance-${CONFORMANCE_VERSION}-Linux-x86_64.tar.gz" ;;
            Linux-ARM64) asset="connectconformance-${CONFORMANCE_VERSION}-Linux-aarch64.tar.gz" ;;
            macOS-ARM64) asset="connectconformance-${CONFORMANCE_VERSION}-Darwin-arm64.tar.gz" ;;
            macOS-X64)   asset="connectconformance-${CONFORMANCE_VERSION}-Darwin-x86_64.tar.gz" ;;
            *) echo "unsupported runner: ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/conformance"
          curl -fsSL "https://github.com/connectrpc/conformance/releases/download/${CONFORMANCE_VERSION}/${asset}" \
            | tar -xz -C "$RUNNER_TEMP/conformance"
          echo "$RUNNER_TEMP/conformance" >> "$GITHUB_PATH"

      - name: Download connectconformance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "connectconformance-$env:CONFORMANCE_VERSION-Windows-x86_64.zip"
          Invoke-WebRequest "https://github.com/connectrpc/conformance/releases/download/$env:CONFORMANCE_VERSION/$asset" -OutFile "$env:RUNNER_TEMP\$asset"
          Expand-Archive "$env:RUNNER_TEMP\$asset" -DestinationPath "$env:RUNNER_TEMP\conformance"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\conformance"

      - name: Run Studio conformance suite (unary subset)
        shell: bash
        run: |
          connectconformance --mode client \
            --conf Tests/GrpCurl.Net.Studio.Conformance/conformance-config.yaml \
            --known-failing @Tests/GrpCurl.Net.Studio.Conformance/known-failing.txt \
            -- dotnet exec Tests/GrpCurl.Net.Studio.Conformance/bin/Release/net10.0/GrpCurl.Net.Studio.Conformance.dll
