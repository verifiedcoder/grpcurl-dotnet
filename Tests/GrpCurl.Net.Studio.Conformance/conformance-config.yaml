# Feature declaration for the connectrpc/conformance suite, Studio adapter (client mode).
# Every non-stream axis (TLS, mTLS, gzip, h2c, trailers, receive-limit) is exercised at full depth
# because the adapter builds its own channel per request. All four stream types run through the
# Studio IInvocationService (E2.1): the desktop application's invocation path is certified end to end.
features:
  versions:
    - HTTP_VERSION_2          # gRPC requires HTTP/2
  protocols:
    - PROTOCOL_GRPC
  codecs:
    - CODEC_PROTO
  compressions:
    - COMPRESSION_IDENTITY
    - COMPRESSION_GZIP        # via grpc-internal-encoding-request, Grpc.Net.Client's built-in
  stream_types:
    - STREAM_TYPE_UNARY
    - STREAM_TYPE_CLIENT_STREAM
    - STREAM_TYPE_SERVER_STREAM
    - STREAM_TYPE_HALF_DUPLEX_BIDI_STREAM
    - STREAM_TYPE_FULL_DUPLEX_BIDI_STREAM
  supports_h2c: true          # plaintext HTTP/2 (prior knowledge)
  supports_tls: true
  supports_tls_client_certs: true
  supports_trailers: true
  supports_message_receive_limit: true
